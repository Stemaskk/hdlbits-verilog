name: Verify solutions compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Syntax-check every solution
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            iverilog -t null "$f" || status=1
          done < <(find . -path ./templates -prune -o -name '*.v' -print0)
          exit $status
